services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memories
      POSTGRES_USER: memories
      POSTGRES_PASSWORD: memories
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memories -d memories"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.30.4
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MEDIA_STORAGE_BUCKET:-memories}
    volumes:
      - ./infra/minio:/config:ro

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/memories
      DB_USERNAME: memories
      DB_PASSWORD: memories
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-bWVtb3JpZXMtbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1rZXktMjAyNg==}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-bWVtb3JpZXMtbG9jYWwtaXAtaGFzaC1zZWNyZXQta2V5LTIwMjY=}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      MEDIA_STORAGE_INTERNAL_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MEDIA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-memories}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  minio-data:
