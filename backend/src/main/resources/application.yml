spring:
  application:
    name: memories-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memories}
    username: ${DB_USERNAME:memories}
    password: ${DB_PASSWORD:memories}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:prod}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

platform:
  auth:
    verification-token-ttl: PT24H
    verification-url-base: ${FRONTEND_URL:http://localhost:3000}/verify-email
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    temporary-lock-duration: ${AUTH_TEMPORARY_LOCK_DURATION:PT15M}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    access-token-issuer: memories-platform
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    refresh-token-family-ttl: ${AUTH_REFRESH_TOKEN_FAMILY_TTL:P30D}
    refresh-cookie-name: memories_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  mail:
    from: ${MAIL_FROM:no-reply@memories.local}
  media:
    provider: ${MEDIA_STORAGE_PROVIDER:MINIO}
    bucket: ${MEDIA_STORAGE_BUCKET:memories}
    region: ${MEDIA_STORAGE_REGION:us-east-1}
    internal-endpoint: ${MEDIA_STORAGE_INTERNAL_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MEDIA_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MEDIA_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_STORAGE_SECRET_KEY:minioadmin}
    presigned-put-ttl: PT10M
    presigned-get-ttl: PT10M
    max-file-size: 10485760
    max-assets-per-owner: 200
    max-bytes-per-owner: 1073741824
  memory:
    password-access-ttl: PT30M
    password-cookie-secure: ${MEMORY_ACCESS_COOKIE_SECURE:false}
  rate-limit:
    login-count: ${LOGIN_RATE_LIMIT_COUNT:20}
    login-window: ${LOGIN_RATE_LIMIT_WINDOW:PT10M}
    upload-count: ${UPLOAD_RATE_LIMIT_COUNT:30}
    upload-window: ${UPLOAD_RATE_LIMIT_WINDOW:PT10M}
    ip-hash-secret: ${IP_HASH_SECRET}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    bucket-retention: ${RATE_LIMIT_BUCKET_RETENTION:PT24H}
    bucket-purge-cron: ${RATE_LIMIT_BUCKET_PURGE_CRON:0 11 3 * * *}
  guest-message:
    rate-limit-count: ${GUEST_MESSAGE_RATE_LIMIT_COUNT:5}
    rate-limit-window: ${GUEST_MESSAGE_RATE_LIMIT_WINDOW:PT10M}
    ip-hash-retention: ${GUEST_MESSAGE_IP_HASH_RETENTION:P30D}
    ip-hash-purge-cron: ${GUEST_MESSAGE_IP_HASH_PURGE_CRON:0 17 3 * * *}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
